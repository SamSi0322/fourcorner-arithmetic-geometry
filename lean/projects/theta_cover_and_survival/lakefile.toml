name = "theta_cover_class_portable"
version = "0.1.0"
defaultTargets = ["ThetaCoverClassPortable"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "ThetaCoverClassPortable"
srcDir = "Source"
moreLeanArgs = ["-Ddebug.skipKernelTC=false", "-DautoImplicit=false", "-DmaxSynthPendingDepth=3", "-Dbackward.isDefEq.respectTransparency.types=false", "-DsynthInstance.maxHeartbeats=400000", "-DmaxHeartbeats=16000000", "-DmaxRecDepth=10000"]
