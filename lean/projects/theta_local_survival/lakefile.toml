name = "theta_local_survival_portable"
version = "0.1.0"
defaultTargets = ["ThetaLocalSurvivalPortable"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "db584cd6d46c92f209a44c0f1c829460d327499d"

[[lean_lib]]
name = "ThetaLocalSurvivalPortable"
srcDir = "Source"
moreLeanArgs = ["-Ddebug.skipKernelTC=false", "-DautoImplicit=false", "-DmaxSynthPendingDepth=3", "-Dbackward.isDefEq.respectTransparency=false", "-Dbackward.isDefEq.respectTransparency.types=false", "-DmaxHeartbeats=16000000"]
